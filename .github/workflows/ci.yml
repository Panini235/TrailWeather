name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'agent/**'
      - '.env.example'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'agent/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: analyze + test + web + android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: 生成平台目录（按当前 Flutter 版本模板，仓库仅保留定制文件）
        run: flutter create --no-pub --platforms=android,web --org dev.trailweather --project-name trailweather .

      - name: 应用山晴名称与图标（平台生成后）
        run: python3 tool/apply_branding.py --platforms android web

      - name: 还原 Android 正式签名文件（仅当已配置 Secrets）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 将使用 debug 签名（不可用于正式分发）"
          fi

      - name: 设置发布包名与签名（app.shanqing.hiking）
        run: python3 tool/configure_release.py --platform android

      - name: 依赖（严格按 pubspec.lock）
        # 必须用仓库锁定的版本：flutter create / 普通 pub get 会把传递依赖升到最新，
        # 0.2.0-beta.1 就因此带上了未经测试的 shared_preferences_android 2.5.0，
        # 正式包被 R8 裁掉 JNI 方法、启动即崩（D-038）。锁文件里是国内镜像地址，
        # CI 换成 pub.dev 下载（内容哈希相同）；任何版本变化都会让这一步失败。
        run: |
          git checkout -- pubspec.lock
          sed -i.bak 's#https://pub.flutter-io.cn#https://pub.dev#' pubspec.lock && rm pubspec.lock.bak
          flutter pub get --enforce-lockfile
          if git diff -U0 pubspec.lock | grep -E '^[-+] +version:'; then
            echo "::error::依赖版本与 pubspec.lock 不一致"; exit 1
          fi

      - name: 静态检查
        run: flutter analyze

      - name: 测试
        run: flutter test

      - name: Web Release 构建
        # 分享图二维码指向本次构建页（lib/core/app_links.dart）
        run: flutter build web --release --source-maps

      - name: 补齐并验证 Web 调试映射
        run: python3 tool/prepare_web_artifact.py --web build/web

      - name: Android APK 构建（release；有 Secrets 时正式签名）
        # 密码只在本步骤可见，由 Gradle 从环境变量读取；分享图二维码指向本次构建页（lib/core/app_links.dart）
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: 记录签名证书指纹
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          {
            echo "### APK 签名"
            if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then echo "正式签名（Secrets）"; else echo "**debug 签名，不可用于正式分发**"; fi
            echo '```'
            echo "$CERTS" | grep -E "certificate DN|SHA-256 digest|SHA-1 digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::已配置正式签名，但 APK 仍是 debug 签名"; exit 1
          fi

      - name: 清理签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
