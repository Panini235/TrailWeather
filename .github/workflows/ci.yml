name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'agent/**'
      - '.env.example'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'agent/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: analyze + test + web + android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: 生成平台目录（按当前 Flutter 版本模板，仓库仅保留定制文件）
        run: flutter create --platforms=android,web --org dev.trailweather --project-name trailweather .

      - name: 应用山晴名称与图标（平台生成后）
        run: python3 tool/apply_branding.py --platforms android web

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 测试
        run: flutter test

      - name: Web Release 构建
        # 分享图二维码指向本次构建页（lib/core/app_links.dart）
        run: flutter build web --release --source-maps --dart-define=SHANQING_DOWNLOAD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 补齐并验证 Web 调试映射
        run: python3 tool/prepare_web_artifact.py --web build/web

      - name: Android APK 构建（release，模板 debug 签名）
        # 分享图二维码指向本次构建页（lib/core/app_links.dart）
        run: flutter build apk --release --dart-define=SHANQING_DOWNLOAD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 验证安装包名称与图标资源
        run: python3 tool/verify_build_branding.py --apk build/app/outputs/flutter-apk/app-release.apk --web build/web

      - name: 上传 Web 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
