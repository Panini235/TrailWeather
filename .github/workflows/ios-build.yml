name: iOS Build (manual)

# iOS 无签名构建 + 未签名 IPA（自签安装用）；需要 macOS runner，默认不在每次 push 触发（节省 runner 分钟）。
# 手动触发：Actions → iOS Build (manual) → Run workflow
on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: 生成 iOS 平台目录
        run: flutter create --platforms=ios --org dev.trailweather --project-name trailweather .

      - name: 应用山晴名称与图标（平台生成后）
        run: python3 tool/apply_branding.py --platforms ios

      - name: 设置 Bundle ID（app.shanqing.hiking）
        run: python3 tool/configure_release.py --platform ios

      - name: 依赖
        run: flutter pub get

      - name: iOS 构建（无签名）
        run: flutter build ios --release --no-codesign

      - name: 验证 iOS 名称与图标资源
        run: python3 tool/verify_build_branding.py --ios-app build/ios/iphoneos/Runner.app

      - name: 打包未签名 IPA（测试者用自己的 Apple ID 自签安装，见 docs/user-guide.md）
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "shanqing-${VERSION}-ios-unsigned.ipa" Payload)
          ls -la build/ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ipa/*.ipa
