name: trailweather
description: "山晴：行前规划，沿途看天气"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 地图：纯 Dart 实现，Android/iOS/Web 三端一致
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # 状态管理与路由
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  # 网络：支持取消（CancelToken）、限流与退避
  dio: ^5.11.1
  # GPX 解析（纯 Dart XML，不解析外部实体）
  xml: ^7.1.0
  # 持久化（三端）：设置/收藏/缓存
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  # 文件导入（GPX/GeoJSON）
  file_selector: ^1.1.0
  # KMZ（zip 包装的 KML）解压；纯 Dart、Web 可用。已是 flutter_map 的传递依赖，
  # 精确锁定发布超过 2 周的版本（见 agent/decisions.md）
  archive: 4.3.0
  # 定位（首页一次性前台定位；之后仅用户主动请求）
  geolocator: ^14.1.1
  # 用户主动打开外部攻略网页（Android/iOS/Web）
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/routes/
    - assets/branding/app-icon.png
